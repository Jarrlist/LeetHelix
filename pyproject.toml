[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leet-helix"
version = "0.2.3"
description = "Practice editing in Helix"
authors = [{name = "User"}]
dependencies = [
    "typer",
    "rich",
    "sqlmodel",
    "sqlite-utils",
    "pyntercept==0.0.5"
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
leet = "leet_helix.main:app"
